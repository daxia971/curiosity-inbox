<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>好奇心收件箱 📮</title>
<style>
  :root{
    --paper:#faf6ee; --card:#ffffff; --ink:#3a3226; --dim:#8c8172;
    --accent:#d9633b; --accent-soft:#f6e3d9; --line:#e7ddcc;
    --green:#4d8f6d; --stamp:#c0392b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",sans-serif;min-height:100vh}
  header{padding:26px 30px 18px;border-bottom:2px dashed var(--line);display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px}
  header h1{font-size:23px;letter-spacing:1px}
  header .sub{color:var(--dim);font-size:13px;margin-top:6px}
  .counts{display:flex;gap:18px;font-size:13px;color:var(--dim)}
  .counts b{font-size:20px;color:var(--accent);margin-right:4px}
  nav{display:flex;gap:8px;padding:16px 30px 0}
  nav button{background:transparent;color:var(--dim);border:none;border-bottom:3px solid transparent;padding:8px 14px;font-size:15px;cursor:pointer;font-family:inherit}
  nav button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:bold}
  main{max-width:820px;margin:0 auto;padding:22px 30px 70px}

  /* 丢问题 */
  .drop{background:var(--accent-soft);border:1px solid #ecc9b8;border-radius:14px;padding:20px 22px;margin-bottom:26px}
  .drop h3{font-size:15px;margin-bottom:10px}
  .droprow{display:flex;gap:10px}
  .droprow input{flex:1;border:1px solid #ddc0af;border-radius:10px;padding:11px 14px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink)}
  .droprow button{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:11px 20px;font-size:14px;cursor:pointer;font-family:inherit;white-space:nowrap}
  .drop .tip{font-size:12px;color:#a06b52;margin-top:10px;line-height:1.7}
  .drop .tip code{background:#fff;padding:1px 8px;border-radius:6px;border:1px solid #ecc9b8}

  /* 答卷卡片 */
  .toolbar{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
  .toolbar input{flex:1;min-width:180px;border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:14px;font-family:inherit;background:var(--card);color:var(--ink)}
  .toolbar button{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 16px;font-size:13px;cursor:pointer;font-family:inherit;color:var(--dim)}
  .entry{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:18px;box-shadow:0 2px 6px rgba(90,70,40,.06);overflow:hidden}
  .entry .head{padding:20px 24px;cursor:pointer;position:relative}
  .entry .date{font-size:12px;color:var(--dim);margin-bottom:8px;display:flex;gap:10px;align-items:center}
  .entry .tag{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:1px 9px;font-size:11px;color:var(--dim)}
  .entry .q{font-size:17px;font-weight:bold;line-height:1.6;padding-right:60px}
  .entry .tldr{margin-top:10px;font-size:14px;color:#6b5f4d;line-height:1.7}
  .entry .stampmark{position:absolute;right:18px;top:16px;border:2px solid var(--stamp);color:var(--stamp);border-radius:8px;font-size:11px;padding:3px 8px;transform:rotate(8deg);opacity:.75;font-weight:bold}
  .entry .body{display:none;padding:4px 24px 22px;border-top:1px dashed var(--line);font-size:15px;line-height:1.95}
  .entry.open .body{display:block}
  .entry .body p{margin:14px 0}
  .entry .body b{color:var(--accent)}
  .entry .sources{margin-top:16px;padding-top:12px;border-top:1px dashed var(--line);font-size:12px;color:var(--dim);line-height:2}
  .entry .sources a{color:var(--green);text-decoration:none}
  .entry .fold{text-align:center;font-size:12px;color:var(--dim);padding-bottom:14px;cursor:pointer;display:none}
  .entry.open .fold{display:block}

  /* 收件箱 */
  .pend{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 20px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:12px}
  .pend .q{font-size:15px;line-height:1.6}
  .pend .d{font-size:12px;color:var(--dim);white-space:nowrap}
  .empty{color:var(--dim);text-align:center;padding:50px 0;line-height:2}
  footer{text-align:center;font-size:12px;color:var(--dim);padding:20px;border-top:2px dashed var(--line)}
  .toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 22px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none}
  .toast.show{opacity:.95}
</style>
</head>
<body>
<header>
  <div>
    <h1>📮 好奇心收件箱</h1>
    <div class="sub">白天随手丢"为什么"，深夜有人替你翻资料，早上收答卷。</div>
  </div>
  <div class="counts"><span><b id="cPend">0</b>待解</span><span><b id="cDone">0</b>已解</span></div>
</header>
<nav>
  <button id="tabAns" class="on">答卷</button>
  <button id="tabInbox">收件箱</button>
</nav>
<main>
  <div class="drop">
    <h3>💭 又好奇什么了？</h3>
    <div class="droprow">
      <input id="dropInput" placeholder="比如：猫为什么怕黄瓜？">
      <button id="dropBtn">复制成指令</button>
    </div>
    <div class="tip">点按钮会把 <code>好奇：你的问题</code> 复制到剪贴板 → 粘给 Claude 即可入箱。今晚的定时任务会自动研究，明早来看答卷。</div>
  </div>
  <section id="viewAns"></section>
  <section id="viewInbox" style="display:none"></section>
</main>
<footer>好奇心不会杀死猫，只会攒出一本你自己的百科全书 · <span id="fUpdated"></span></footer>
<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script>
const $=s=>document.querySelector(s);
const items=(window.CURIO&&CURIO.items)||[];
const answered=items.filter(i=>i.status==="answered").sort((a,b)=>b.answered<a.answered?-1:1);
const pending=items.filter(i=>i.status==="pending");
$("#cPend").textContent=pending.length;
$("#cDone").textContent=answered.length;
$("#fUpdated").textContent="最近更新 "+(window.CURIO?CURIO.updated:"—");

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2200); }

$("#dropBtn").onclick=()=>{
  const v=$("#dropInput").value.trim();
  if(!v){ toast("先写下你的『为什么』"); return; }
  navigator.clipboard.writeText("好奇："+v).then(()=>toast("已复制，去粘给 Claude 吧 📮"))
    .catch(()=>{ prompt("手动复制这行发给 Claude：","好奇："+v); });
};
$("#dropInput").addEventListener("keydown",e=>{ if(e.key==="Enter") $("#dropBtn").click(); });

function renderAns(){
  const v=$("#viewAns");
  if(answered.length===0){ v.innerHTML='<div class="empty">还没有答卷。<br>丢几个问题进收件箱，今晚就开工。</div>'; return; }
  v.innerHTML=`
    <div class="toolbar">
      <input id="q" placeholder="搜答卷…">
      <button id="lucky">🎲 随机重温</button>
    </div>
    <div id="list"></div>`;
  const draw=kw=>{
    kw=(kw||"").toLowerCase();
    const list=answered.filter(e=>!kw||(e.q+e.tldr+(e.tags||[]).join("")+e.body).toLowerCase().includes(kw));
    $("#list").innerHTML=list.map(e=>`
      <div class="entry" id="e-${e.id}">
        <div class="head">
          <div class="stampmark">已解</div>
          <div class="date">📅 ${e.answered}${(e.tags||[]).map(t=>'<span class="tag">'+t+'</span>').join("")}</div>
          <div class="q">${e.q}</div>
          <div class="tldr">💡 ${e.tldr}</div>
        </div>
        <div class="body">${e.body}
          <div class="sources">📚 深夜查阅了：<br>${(e.sources||[]).map(s=>'<a href="'+s.u+'" target="_blank">'+s.t+'</a>').join("<br>")}</div>
        </div>
        <div class="fold">收起 ▲</div>
      </div>`).join("") || '<div class="empty">没搜到。</div>';
    document.querySelectorAll(".entry .head").forEach(h=>h.onclick=()=>h.parentElement.classList.toggle("open"));
    document.querySelectorAll(".entry .fold").forEach(f=>f.onclick=()=>f.parentElement.classList.remove("open"));
  };
  $("#q").oninput=e=>draw(e.target.value);
  $("#lucky").onclick=()=>{
    const e=answered[Math.floor(Math.random()*answered.length)];
    draw(""); const el=$("#e-"+e.id); el.classList.add("open"); el.scrollIntoView({behavior:"smooth",block:"start"});
  };
  draw("");
}

function renderInbox(){
  const v=$("#viewInbox");
  v.innerHTML = pending.length===0
    ? '<div class="empty">收件箱空空如也。<br>难得，享受一下没有疑问的人生。</div>'
    : pending.map(p=>`<div class="pend"><div class="q">❓ ${p.q}</div><div class="d">${p.asked} 投递 · 排队中</div></div>`).join("");
}

$("#tabAns").onclick=()=>{ $("#tabAns").classList.add("on"); $("#tabInbox").classList.remove("on"); $("#viewAns").style.display=""; $("#viewInbox").style.display="none"; };
$("#tabInbox").onclick=()=>{ $("#tabInbox").classList.add("on"); $("#tabAns").classList.remove("on"); $("#viewInbox").style.display=""; $("#viewAns").style.display="none"; renderInbox(); };

renderAns();
</script>
</body>
</html>
